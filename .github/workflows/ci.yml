name: CI

on:
  pull_request:
    branches:
      - "v[0-9]+.[0-9][0-9]"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, audit, OpenNext build, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit regression tests
        run: npm run test:unit

      - name: Generate Cloudflare types
        run: npm run cf-typegen

      # Validate the OpenNext worker artifact without uploading or deploying it.
      - name: Build OpenNext worker
        run: npm run build:worker

      # Run after the build because Next.js generates route types during build.
      - name: Typecheck
        run: npx tsc --noEmit

  browser:
    name: Chromium responsive smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and pinned Playwright
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Build locally served production site
        run: npm run build

      - name: Test desktop, tablet, mobile and capture screenshots
        run: npm run smoke:browser

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-browser-smoke
          path: artifacts/browser-smoke/
          if-no-files-found: warn
          retention-days: 14
